name: Contribution Snake

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/wrap_snake.py"

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Verlintas
          outputs: |
            dist/github-snake.svg?color_snake=#ff2d3d&color_dots=#141016,#3a0d13,#6b1220,#a81a2c,#ff2d3d
      - name: Wrap in the profile card style
        run: python3 scripts/wrap_snake.py dist/github-snake.svg
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
