name: Contribution Heatmap

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/build_contribution_heatmap.py"
      - ".github/workflows/contribution-heatmap.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build heatmap SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_contribution_heatmap.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet contrib-heatmap.svg; then
            git config user.name "heatmap-bot"
            git config user.email "actions@users.noreply.github.com"
            git add contrib-heatmap.svg
            git commit -m "Update contribution heatmap"
            # the profile-assets workflow may land a commit at the same moment
            for attempt in 1 2 3; do
              if git pull --rebase --autostash && git push; then
                break
              fi
              sleep 5
            done
          else
            echo "heatmap unchanged"
          fi
