name: Profile Assets

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/build_profile_assets.py"
      - "scripts/build_profile_stats.py"
      - ".github/workflows/profile-assets.yml"

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build static art
        run: python3 scripts/build_profile_assets.py
      - name: Build live stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_profile_stats.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet assets/; then
            git config user.name "profile-bot"
            git config user.email "actions@users.noreply.github.com"
            git add assets/
            git commit -m "Update profile assets"
            # another bot workflow may land a commit at the same moment
            for attempt in 1 2 3; do
              if git pull --rebase --autostash && git push; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          else
            echo "assets unchanged"
          fi
