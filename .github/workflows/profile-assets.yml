name: Profile Assets

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/build_profile_assets.py"
      - "scripts/build_profile_stats.py"
      - ".github/workflows/profile-assets.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build static art
        run: python3 scripts/build_profile_assets.py
      - name: Build live stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_profile_stats.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet assets/; then
            git config user.name "profile-bot"
            git config user.email "actions@users.noreply.github.com"
            git add assets/
            git commit -m "Update profile assets"
            git push
          else
            echo "assets unchanged"
          fi
